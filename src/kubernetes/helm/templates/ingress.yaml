{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
  - host: {{ .host }}
    http:
      paths:
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: monolith
            port:
              number: 8080
      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: monolith
            port:
              number: 8080
      - path: /api/payments
        pathType: Prefix
        backend:
          service:
            name: monolith
            port:
              number: 8080
      - path: /api/subscriptions
        pathType: Prefix
        backend:
          service:
            name: monolith
            port:
              number: 8080
      - path: /api/movies
        pathType: Prefix
        backend:
          service:
            name: movies-service
            port:
              number: 8081
      - path: /api/events
        pathType: Prefix
        backend:
          service:
            name: events-service
            port:
              number: 8082
      - path: /
        pathType: Prefix
        backend:
          service:
            name: proxy-service
            port:
              number: 8000
      {{- range .paths }}
      - path: {{ .path }}
        pathType: {{ .pathType }}
        backend:
          service:
            name: {{ .service }}
            port:
              number: {{ .port }}
      {{- end }}
  {{- end }}
{{- end }}